<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Countdown Timer</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        * {
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #030712;
            width: 100%;
            height: 100%;
            height: 100dvh;
        }
        
        .tab-content { display: none; }
        .tab-content.active { display: flex; }
        .timer-display { font-family: 'Monaco', 'Courier New', monospace; letter-spacing: 0.1em; font-weight: 900; transition: color 0.3s ease; }
        input[type="number"], textarea, input[type="text"] { font-size: 16px !important; }
        
        /* Fullscreen styles */
        body.fullscreen-mode {
            position: fixed;
            width: 100vw;
            height: 100dvh;
            top: 0;
            left: 0;
            z-index: 10000;
        }
        
        body.fullscreen-mode #setup-section, 
        body.fullscreen-mode #setup-section-interval,
        body.fullscreen-mode .tab-navigation,
        body.fullscreen-mode .control-buttons { 
            display: none !important; 
        }
        
        body.fullscreen-mode .timer-container {
            width: 100vw;
            height: 100dvh;
            position: fixed;
            top: 0;
            left: 0;
            border-radius: 0;
            border: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: justify-between;
            background: linear-gradient(135deg, #020617 0%, #0f172a 100%);
        }
        
        body.fullscreen-mode .timer-display {
            font-size: clamp(60px, 32vw, 40vh) !important;
            line-height: 1;
            margin: 0;
            padding: 0;
        }
        
        /* LARGE PHASE DETAILS STYLING */
        .phase-display {
            font-size: clamp(24px, 5.5vw, 42px) !important;
            line-height: 1.2;
            font-weight: 800;
            text-align: center;
            max-width: 95%;
            word-wrap: break-word;
            word-break: break-word;
        }

        body.fullscreen-mode .phase-display {
            font-size: clamp(36px, 10vw, 12vh) !important;
            line-height: 1.2;
            font-weight: 900;
            color: #f8fafc;
            margin: 1.5rem 0;
            text-shadow: 0 4px 12px rgba(0,0,0,0.6);
        }
        
        body.fullscreen-mode .round-display {
            font-size: clamp(18px, 4vw, 5vh) !important;
            color: #94a3b8;
        }
        
        body.fullscreen-mode .exit-fullscreen-btn { 
            display: flex !important; 
        }
        
        /* Dynamic Theme Glow Colors */
        .theme-work { color: #10b981 !important; text-shadow: 0 0 30px rgba(16, 185, 129, 0.4); }
        .theme-recovery { color: #06b6d4 !important; text-shadow: 0 0 30px rgba(6, 182, 212, 0.4); }
        .theme-prep { color: #f59e0b !important; text-shadow: 0 0 30px rgba(245, 158, 11, 0.4); }
        .theme-countdown { color: #ef4444 !important; text-shadow: 0 0 30px rgba(239, 68, 68, 0.4); }

        /* Portrait adjustments */
        @media (orientation: portrait) {
            body.fullscreen-mode .timer-container {
                padding: 0 0 2rem 0; 
                justify-content: space-between;
                gap: 0.5rem; 
            }
            body.fullscreen-mode .timer-display { font-size: clamp(60px, 28vw, 32vh) !important; }
            body.fullscreen-mode .phase-display { font-size: clamp(28px, 8vw, 10vh) !important; margin: 0.5rem 0; }
            body.fullscreen-mode .round-display { font-size: clamp(18px, 5vw, 6vh) !important; }
        }
        
        /* Landscape adjustments */
        @media (orientation: landscape) {
            body.fullscreen-mode .timer-container {
                padding: 0 0 1rem 0; 
                justify-content: space-between;
                align-items: center;
            }
            body.fullscreen-mode .middle-layout-box {
                flex-direction: row !important;
                gap: 4rem;
                justify-content: center;
                align-items: center;
                flex-grow: 1;
            }
            body.fullscreen-mode .timer-display { font-size: clamp(60px, 25vw, 32vh) !important; }
            body.fullscreen-mode .phase-display { font-size: clamp(24px, 6.5vw, 9vh) !important; max-width: 45%; text-align: left; }
            body.fullscreen-mode .round-display { position: absolute; bottom: 1.5rem; right: 2.5rem; font-size: clamp(16px, 3.5vw, 5vh) !important; }
        }
        
        /* Premium Floating Exit Fullscreen Action Control Style */
        .exit-fullscreen-btn { 
            display: none; 
            align-items: center;
            justify-content: center;
            position: absolute; 
            top: 14px; 
            right: 16px; 
            z-index: 10005; 
            background: rgba(255, 255, 255, 0.08); 
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            width: 40px;
            height: 40px;
            border-radius: 50%; 
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.8);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .exit-fullscreen-btn:hover {
            background: rgba(255, 255, 255, 0.16);
            color: #ffffff;
            transform: scale(1.05);
        }
        .exit-fullscreen-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="bg-gray-950 text-white font-sans flex flex-col h-screen overflow-hidden">

    <div class="tab-navigation flex gap-2 p-3 bg-gray-900 border-b border-gray-800 shrink-0">
        <button onclick="switchTab('countdown')" class="tab-btn flex-1 py-2 px-3 rounded-lg font-bold text-sm transition active:scale-95 bg-red-600 hover:bg-red-500" data-tab="countdown">
            ⏳ Countdown Timer
        </button>
        <button onclick="switchTab('interval')" class="tab-btn flex-1 py-2 px-3 rounded-lg font-bold text-sm transition active:scale-95 bg-gray-700 hover:bg-gray-600" data-tab="interval">
            🔄 Interval Training
        </button>
    </div>

    <div id="countdown" class="tab-content active flex-col flex-grow p-4 overflow-y-auto">
        <div class="flex flex-col gap-4 flex-grow">
            <div id="setup-section" class="bg-gray-900 p-3 rounded-xl border border-gray-800 max-h-[35vh] overflow-y-auto">
                <h3 class="text-base font-black mb-2 text-red-400">Countdown Timer Setup</h3>
                <div class="grid grid-cols-3 gap-2 mb-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-1">Minutes</label>
                        <input type="number" id="countdown-minutes" value="5" min="0" max="59" class="w-full bg-gray-950 border border-gray-700 rounded-lg p-2 text-center font-bold text-white text-sm focus:outline-none focus:border-red-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-1">Seconds</label>
                        <input type="number" id="countdown-seconds" value="0" min="0" max="59" class="w-full bg-gray-950 border border-gray-700 rounded-lg p-2 text-center font-bold text-white text-sm focus:outline-none focus:border-red-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-1">Rounds</label>
                        <input type="number" id="countdown-rounds" value="1" min="1" max="100" class="w-full bg-gray-950 border border-gray-700 rounded-lg p-2 text-center font-bold text-white text-sm focus:outline-none focus:border-red-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-1">Timer Details</label>
                    <textarea id="countdown-details" placeholder="e.g., Sprint intervals..." class="w-full bg-gray-950 border border-gray-700 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-red-500 h-12 resize-none"></textarea>
                </div>
            </div>

            <div class="timer-container bg-gradient-to-br from-gray-900 to-gray-950 rounded-xl border border-gray-800 flex-grow flex flex-col justify-between items-center relative overflow-hidden">
                
                <button onclick="exitFullscreen()" class="exit-fullscreen-btn" aria-label="Exit Fullscreen">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
                
                <div id="countdown-topic-box" class="w-full text-center py-5 bg-red-950/20 backdrop-blur-md border-b border-red-500/10 shrink-0 transition-all duration-300">
                    <span id="countdown-label-display" class="text-2xl tracking-widest font-black text-red-400 block uppercase">COUNTDOWN</span>
                </div>

                <div class="middle-layout-box text-center w-full my-auto flex flex-col justify-center items-center gap-2 p-4">
                    <div class="timer-display theme-countdown" id="countdown-display">05:00</div>
                    <div id="countdown-details-display" class="phase-display text-gray-200"></div>
                </div>

                <div class="text-center w-full pb-4 shrink-0">
                    <div class="text-base font-bold text-gray-300 round-display">
                        Round: <span id="countdown-round-display" class="text-red-400">1</span> / <span id="countdown-total-rounds">1</span>
                    </div>
                </div>
            </div>

            <div class="control-buttons grid grid-cols-3 gap-2 shrink-0">
                <button onclick="startCountdownTimer()" class="py-2 px-3 bg-red-600 hover:bg-red-500 active:bg-red-700 text-white font-black rounded-lg text-sm transition active:scale-95">▶️ Start</button>
                <button onclick="pauseCountdownTimer()" class="py-2 px-3 bg-yellow-600 hover:bg-yellow-500 active:bg-yellow-700 text-white font-black rounded-lg text-sm transition active:scale-95">⏸️ Pause</button>
                <button onclick="resetCountdownTimer()" class="py-2 px-3 bg-gray-700 hover:bg-gray-600 active:bg-gray-800 text-white font-black rounded-lg text-sm transition active:scale-95">🔄 Reset</button>
            </div>
        </div>
    </div>

    <div id="interval" class="tab-content flex-col flex-grow p-4 overflow-y-auto">
        <div class="flex flex-col gap-4 flex-grow">
            <div id="setup-section-interval" class="bg-gray-900 p-3 rounded-xl border border-gray-800 max-h-[40vh] overflow-y-auto">
                <h3 class="text-base font-black mb-2 text-emerald-400">Interval Training Setup</h3>
                <div class="grid grid-cols-3 gap-2 mb-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-1">Work (sec)</label>
                        <input type="number" id="interval-work-time" value="30" min="1" max="600" class="w-full bg-gray-950 border border-gray-700 rounded-lg p-2 text-center font-bold text-white text-sm focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-1">Recovery (sec)</label>
                        <input type="number" id="interval-recovery-time" value="30" min="1" max="600" class="w-full bg-gray-950 border border-gray-700 rounded-lg p-2 text-center font-bold text-white text-sm focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-1">Rounds</label>
                        <input type="number" id="interval-rounds" value="5" min="1" max="100" class="w-full bg-gray-950 border border-gray-700 rounded-lg p-2 text-center font-bold text-white text-sm focus:outline-none focus:border-emerald-500">
                    </div>
                </div>
                <div class="mb-2">
                    <label class="block text-xs font-bold text-gray-400 mb-1">Work Phrase</label>
                    <textarea id="interval-work-details" placeholder="e.g., High intensity sprint..." class="w-full bg-gray-950 border border-gray-700 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-emerald-500 h-12 resize-none"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-1">Recovery Phrase</label>
                    <textarea id="interval-recovery-details" placeholder="e.g., Easy pace, catch breath..." class="w-full bg-gray-950 border border-gray-700 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-emerald-500 h-12 resize-none"></textarea>
                </div>
            </div>

            <div class="timer-container bg-gradient-to-br from-gray-900 to-gray-950 rounded-xl border border-gray-800 flex-grow flex flex-col justify-between items-center relative overflow-hidden">
                
                <button onclick="exitFullscreen()" class="exit-fullscreen-btn" aria-label="Exit Fullscreen">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
                
                <div id="interval-topic-box" class="w-full text-center py-5 bg-emerald-950/20 backdrop-blur-md border-b border-emerald-500/10 shrink-0 transition-all duration-300">
                    <span id="interval-label-display" class="text-2xl tracking-widest font-black text-emerald-400 block uppercase">WORK PHASE</span>
                </div>

                <div class="middle-layout-box text-center w-full my-auto flex flex-col justify-center items-center gap-2 p-4">
                    <div class="timer-display theme-work" id="interval-display">00:30</div>
                    <div id="interval-details-display" class="phase-display text-emerald-200"></div>
                </div>

                <div class="text-center w-full pb-4 shrink-0">
                    <div class="text-lg font-bold text-gray-300 round-display">
                        Round: <span id="interval-round-display" class="text-emerald-400">1</span> / <span id="interval-total-rounds">5</span>
                    </div>
                </div>
            </div>

            <div class="control-buttons grid grid-cols-3 gap-2 shrink-0">
                <button onclick="startInterval()" class="py-2 px-3 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-black rounded-lg text-sm transition active:scale-95">▶️ Start</button>
                <button onclick="pauseInterval()" class="py-2 px-3 bg-yellow-600 hover:bg-yellow-500 active:bg-yellow-700 text-white font-black rounded-lg text-sm transition active:scale-95">⏸️ Pause</button>
                <button onclick="resetInterval()" class="py-2 px-3 bg-gray-700 hover:bg-gray-600 active:bg-gray-800 text-white font-black rounded-lg text-sm transition active:scale-95">🔄 Reset</button>
            </div>
        </div>
    </div>

    <script>
        // --- Service Worker Live Notification Integration ---
        let swRegistration = null;

        // Register a system-level notification service worker using an inline Blob URL
        if ('serviceWorker' in navigator && 'Notification' in window) {
            const swCode = `
                self.addEventListener('message', (event) => {
                    if (event.data.action === 'updateNotification') {
                        const { title, body, silent } = event.data;
                        self.registration.showNotification(title, {
                            body: body,
                            tag: 'live-timer-sync', // Overwrites previous step notification smoothly
                            renotify: false,        // Prevents phone from vibrating/buzzing every single second
                            silent: silent,         // Quiet tracking mode
                            icon: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="%23ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>'
                        });
                    } else if (event.data.action === 'clearNotification') {
                        self.registration.getNotifications({ tag: 'live-timer-sync' }).then((notifications) => {
                            notifications.forEach(n => n.close());
                        });
                    }
                });
            `;
            const blob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(blob);
            
            navigator.serviceWorker.register(swUrl).then(reg => {
                swRegistration = reg;
                console.log('Notification Service Worker Active');
            }).catch(err => console.error('Service Worker Registry Failed', err));
        }

        // Send a message to the Service Worker engine to update or dismiss the native system overlay
        function updateSystemStatusBar(title, body, silent = true) {
            if (swRegistration && Notification.permission === 'granted') {
                if (navigator.serviceWorker.controller) {
                    navigator.serviceWorker.controller.postMessage({ action: 'updateNotification', title, body, silent });
                } else {
                    swRegistration.active?.postMessage({ action: 'updateNotification', title, body, silent });
                }
            }
        }

        function clearSystemStatusBar() {
            if (swRegistration) {
                if (navigator.serviceWorker.controller) {
                    navigator.serviceWorker.controller.postMessage({ action: 'clearNotification' });
                } else {
                    swRegistration.active?.postMessage({ action: 'clearNotification' });
                }
            }
        }

        function requestNotificationAccess() {
            if ('Notification' in window && Notification.permission === 'default') {
                Notification.requestPermission();
            }
        }
        // ---------------------------------------------------

        function getAudioCtx() {
            if (!window.sharedAudioCtx) window.sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (window.sharedAudioCtx.state === 'suspended') window.sharedAudioCtx.resume();
            return window.sharedAudioCtx;
        }

        function playTrackBeep(isFinal) {
            try {
                const audioCtx = getAudioCtx();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode); gainNode.connect(audioCtx.destination);
                oscillator.type = 'square';
                oscillator.frequency.setValueAtTime(isFinal ? 990 : 490, audioCtx.currentTime + 0.05);
                gainNode.gain.setValueAtTime(0, audioCtx.currentTime + 0.05);
                gainNode.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.06);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime + (isFinal ? 0.8 : 0.4) - 0.01);
                gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + (isFinal ? 0.8 : 0.4));
                oscillator.start(audioCtx.currentTime + 0.05); oscillator.stop(audioCtx.currentTime + (isFinal ? 0.8 : 0.4));
            } catch (e) { console.error(e); }
        }

        function requestFullscreen(element) {
            if (element.requestFullscreen) element.requestFullscreen().catch(err => console.error(err));
            else if (element.webkitRequestFullscreen) element.webkitRequestFullscreen().catch(err => console.error(err));
            document.body.classList.add("fullscreen-mode");
        }

        function exitFullscreen() {
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            document.body.classList.remove('fullscreen-mode');
        }

        // Countdown Module Engine
        let countdownInterval = null, countdownRunning = false, countdownRemaining = 0;
        let countdownCurrentRound = 1, countdownTotalRounds = 1;
        let countdownCountdownPhase = false, countdownCountdownValue = 5;

        function getCountdownSetupTime() {
            return (parseInt(document.getElementById('countdown-minutes').value) || 0) * 60 + (parseInt(document.getElementById('countdown-seconds').value) || 0);
        }

        function formatTimeText(totalSecs) {
            return `${String(Math.floor(totalSecs / 60)).padStart(2, '0')}:${String(totalSecs % 60).padStart(2, '0')}`;
        }

        function startCountdownTimer() {
            if (countdownRunning) return;
            requestNotificationAccess(); // Ensure permission hook is triggered
            if (countdownRemaining === 0) {
                countdownRemaining = getCountdownSetupTime();
                countdownTotalRounds = parseInt(document.getElementById('countdown-rounds').value) || 1;
                countdownCurrentRound = 1; countdownCountdownPhase = true; countdownCountdownValue = 5;
                requestFullscreen(document.body);
            }
            countdownRunning = true;
            countdownInterval = setInterval(() => {
                if (countdownCountdownPhase) {
                    if (countdownCountdownValue > 0) {
                        playTrackBeep(false);
                        document.getElementById('countdown-display').textContent = countdownCountdownValue;
                        document.getElementById('countdown-details-display').textContent = 'Get Ready...';
                        
                        setWidgetTheme('countdown', 'prep', 'PREPARATION');
                        updateSystemStatusBar(`Get Ready! (${countdownCountdownValue}s)`, `Round ${countdownCurrentRound}/${countdownTotalRounds}`);
                        countdownCountdownValue--;
                    } else {
                        playTrackBeep(true); countdownCountdownPhase = false; countdownCountdownValue = -1;
                        updateCountdownDisplay();
                    }
                } else {
                    countdownRemaining--;
                    updateCountdownDisplay();
                    if (countdownRemaining === 20 || countdownRemaining === 10) playTrackBeep(false);
                    if (countdownRemaining === 0) {
                        playTrackBeep(true);
                        if (countdownCurrentRound < countdownTotalRounds) {
                            countdownCurrentRound++; countdownCountdownPhase = true; countdownCountdownValue = 5;
                            countdownRemaining = getCountdownSetupTime();
                        } else {
                            clearInterval(countdownInterval); countdownRunning = false; exitFullscreen();
                            updateSystemStatusBar("Timer Finished!", "All rounds completed.", false);
                        }
                    }
                }
            }, 1000);
        }

        function pauseCountdownTimer() { 
            countdownRunning = false; 
            clearInterval(countdownInterval); 
            updateSystemStatusBar("Timer Paused", formatTimeText(countdownRemaining));
        }
        
        function resetCountdownTimer() {
            countdownRunning = false; clearInterval(countdownInterval);
            countdownRemaining = 0; countdownCurrentRound = 1; countdownCountdownPhase = false; countdownCountdownValue = 5;
            updateCountdownDisplay(); exitFullscreen();
            clearSystemStatusBar();
        }

        function updateCountdownDisplay() {
            if (!countdownRunning && countdownRemaining === 0) {
                const totalSecs = getCountdownSetupTime();
                document.getElementById('countdown-display').textContent = formatTimeText(totalSecs);
                document.getElementById('countdown-details-display').textContent = document.getElementById('countdown-details').value;
                document.getElementById('countdown-round-display').textContent = '1';
                document.getElementById('countdown-total-rounds').textContent = parseInt(document.getElementById('countdown-rounds').value) || 1;
                setWidgetTheme('countdown', 'countdown', 'COUNTDOWN');
                return;
            }

            if (countdownCountdownPhase && countdownCountdownValue > 0) {
                document.getElementById('countdown-display').textContent = countdownCountdownValue;
                document.getElementById('countdown-details-display').textContent = 'Get Ready...';
                setWidgetTheme('countdown', 'prep', 'PREPARATION');
            } else {
                const displaySecs = countdownCountdownValue === 0 ? 'GO!' : formatTimeText(countdownRemaining);
                document.getElementById('countdown-display').textContent = displaySecs;
                document.getElementById('countdown-details-display').textContent = document.getElementById('countdown-details').value;
                setWidgetTheme('countdown', 'countdown', 'COUNTDOWN');
                
                // Keep Lock screen updating dynamically
                const subtitleText = document.getElementById('countdown-details').value || "Countdown running...";
                updateSystemStatusBar(`${displaySecs} | Round ${countdownCurrentRound}/${countdownTotalRounds}`, subtitleText);
            }
            document.getElementById('countdown-round-display').textContent = countdownCurrentRound;
            document.getElementById('countdown-total-rounds').textContent = countdownTotalRounds;
        }

        // Interval Loop Engine
        let intervalTimer = null, intervalRunning = false, intervalRemaining = 0;
        let intervalCurrentRound = 1, intervalTotalRounds = 1;
        let intervalIsWorkPhase = true, intervalWorkTime = 30, intervalRecoveryTime = 30;
        let intervalStartCountdown = 5, intervalInStartPhase = false;

        function startInterval() {
            if (intervalRunning) return;
            requestNotificationAccess();
            if (intervalRemaining === 0) {
                intervalWorkTime = parseInt(document.getElementById('interval-work-time').value) || 30;
                intervalRecoveryTime = parseInt(document.getElementById('interval-recovery-time').value) || 30;
                intervalTotalRounds = parseInt(document.getElementById('interval-rounds').value) || 1;
                intervalCurrentRound = 1; intervalIsWorkPhase = true;
                intervalRemaining = intervalWorkTime; intervalStartCountdown = 5;
                intervalInStartPhase = true; requestFullscreen(document.body);
            }
            
            intervalRunning = true;
            intervalTimer = setInterval(() => {
                if (intervalInStartPhase) {
                    if (intervalStartCountdown > 0) {
                        playTrackBeep(false);
                        document.getElementById('interval-display').textContent = intervalStartCountdown;
                        document.getElementById('interval-details-display').textContent = 'Get Ready...';
                        setWidgetTheme('interval', 'prep', 'PREPARATION');
                        updateSystemStatusBar(`Get Ready! (${intervalStartCountdown}s)`, `Interval Round 1/${intervalTotalRounds}`);
                        intervalStartCountdown--;
                    } else {
                        playTrackBeep(true); intervalInStartPhase = false;
                        updateIntervalDisplay();
                    }
                } else {
                    intervalRemaining--;
                    updateIntervalDisplay();
                    if (!intervalIsWorkPhase && intervalRemaining <= 5 && intervalRemaining > 0) playTrackBeep(false);
                    if (intervalRemaining === 0) {
                        playTrackBeep(true);
                        if (intervalIsWorkPhase) {
                            intervalIsWorkPhase = false; intervalRemaining = intervalRecoveryTime;
                        } else {
                            if (intervalCurrentRound < intervalTotalRounds) {
                                intervalCurrentRound++; intervalIsWorkPhase = true; intervalRemaining = intervalWorkTime;
                            } else {
                                clearInterval(intervalTimer); intervalRunning = false; exitFullscreen();
                                updateSystemStatusBar("Interval Training Completed!", "Done!", false);
                            }
                        }
                    }
                }
            }, 1000);
        }

        function pauseInterval() { 
            intervalRunning = false; 
            clearInterval(intervalTimer); 
            updateSystemStatusBar("Interval Paused", formatTimeText(intervalRemaining));
        }
        
        function resetInterval() {
            intervalRunning = false; clearInterval(intervalTimer);
            intervalRemaining = 0; intervalCurrentRound = 1; intervalIsWorkPhase = true; intervalInStartPhase = false;
            updateIntervalDisplay(); exitFullscreen();
            clearSystemStatusBar();
        }

        function updateIntervalDisplay() {
            if (!intervalRunning && intervalRemaining === 0) {
                const setupWork = parseInt(document.getElementById('interval-work-time').value) || 0;
                document.getElementById('interval-display').textContent = formatTimeText(setupWork);
                document.getElementById('interval-details-display').textContent = document.getElementById('interval-work-details').value;
                document.getElementById('interval-round-display').textContent = '1';
                document.getElementById('interval-total-rounds').textContent = parseInt(document.getElementById('interval-rounds').value) || 5;
                setWidgetTheme('interval', 'work', 'WORK PHASE');
                return;
            }

            const currentFormattedTime = formatTimeText(intervalRemaining);
            document.getElementById('interval-display').textContent = currentFormattedTime;
            document.getElementById('interval-details-display').textContent = intervalIsWorkPhase ? document.getElementById('interval-work-details').value : document.getElementById('interval-recovery-details').value;
            
            if (intervalInStartPhase) {
                setWidgetTheme('interval', 'prep', 'PREPARATION');
            } else {
                const activeStateText = intervalIsWorkPhase ? 'WORK PHASE' : 'RECOVERY PHASE';
                setWidgetTheme('interval', intervalIsWorkPhase ? 'work' : 'recovery', activeStateText);
                
                // Track Interval parameters to lock screen notification drawer
                const taskDescriptor = intervalIsWorkPhase ? document.getElementById('interval-work-details').value : document.getElementById('interval-recovery-details').value;
                updateSystemStatusBar(`[${activeStateText}] ${currentFormattedTime} (R${intervalCurrentRound}/${intervalTotalRounds})`, taskDescriptor || "Keep moving!");
            }
            
            document.getElementById('interval-round-display').textContent = intervalCurrentRound;
            document.getElementById('interval-total-rounds').textContent = intervalTotalRounds;
        }

        // Shared Presentation Framework Manager
        function setWidgetTheme(type, state, headingText) {
            const topicBox = document.getElementById(`${type}-topic-box`);
            const labelNode = document.getElementById(`${type}-label-display`);
            const digitsNode = document.getElementById(`${type}-display`);
            const roundNum = document.getElementById(`${type}-round-display`);
            
            labelNode.textContent = headingText;
            digitsNode.className = "timer-display";
            if(roundNum) roundNum.className = "";

            if (state === 'work') {
                topicBox.className = "w-full text-center py-5 bg-emerald-950/20 backdrop-blur-md border-b border-emerald-500/10 shrink-0 transition-all duration-300";
                labelNode.className = "text-2xl tracking-widest font-black text-emerald-400 block uppercase";
                digitsNode.classList.add("theme-work");
                if(roundNum) roundNum.classList.add("text-emerald-400");
            } else if (state === 'recovery') {
                topicBox.className = "w-full text-center py-5 bg-cyan-950/20 backdrop-blur-md border-b border-cyan-500/10 shrink-0 transition-all duration-300";
                labelNode.className = "text-2xl tracking-widest font-black text-cyan-400 block uppercase";
                digitsNode.classList.add("theme-recovery");
                if(roundNum) roundNum.classList.add("text-cyan-400");
            } else if (state === 'prep') {
                topicBox.className = "w-full text-center py-5 bg-amber-950/20 backdrop-blur-md border-b border-amber-500/10 shrink-0 transition-all duration-300";
                labelNode.className = "text-2xl tracking-widest font-black text-amber-400 block uppercase";
                digitsNode.classList.add("theme-prep");
                if(roundNum) roundNum.classList.add("text-amber-400");
            } else if (state === 'countdown') {
                topicBox.className = "w-full text-center py-5 bg-red-950/20 backdrop-blur-md border-b border-red-500/10 shrink-0 transition-all duration-300";
                labelNode.className = "text-2xl tracking-widest font-black text-red-400 block uppercase";
                digitsNode.classList.add("theme-countdown");
                if(roundNum) roundNum.classList.add("text-red-400");
            }
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = "tab-btn flex-1 py-2 px-3 rounded-lg font-bold text-sm transition active:scale-95 bg-gray-700 hover:bg-gray-600";
            });
            document.getElementById(tabName).classList.add('active');
            const activeBtn = document.querySelector(`[data-tab="${tabName}"]`);
            if (tabName === 'countdown') { activeBtn.className = "tab-btn flex-1 py-2 px-3 rounded-lg font-bold text-sm transition active:scale-95 bg-red-600 hover:bg-red-500"; } 
            else { activeBtn.className = "tab-btn flex-1 py-2 px-3 rounded-lg font-bold text-sm transition active:scale-95 bg-emerald-600 hover:bg-emerald-500"; }
        }

        // Configuration Event Binding Hookups
        document.getElementById('countdown-minutes').addEventListener('input', updateCountdownDisplay);
        document.getElementById('countdown-seconds').addEventListener('input', updateCountdownDisplay);
        document.getElementById('countdown-rounds').addEventListener('input', updateCountdownDisplay);
        document.getElementById('countdown-details').addEventListener('input', updateCountdownDisplay);
        document.getElementById('interval-work-time').addEventListener('input', updateIntervalDisplay);
        document.getElementById('interval-recovery-time').addEventListener('input', updateIntervalDisplay);
        document.getElementById('interval-rounds').addEventListener('input', updateIntervalDisplay);
        document.getElementById('interval-work-details').addEventListener('input', updateIntervalDisplay);
        document.getElementById('interval-recovery-details').addEventListener('input', () => {
            if (!intervalRunning && intervalRemaining === 0) updateIntervalDisplay();
        });

        updateCountdownDisplay(); updateIntervalDisplay();
    </script>
</body>
</html>
