<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Training Timer</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        * {
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #030712;
            width: 100%;
            height: 100%;
            height: 100dvh;
        }
        
        .tab-content { display: none; }
        .tab-content.active { display: flex; }
        .timer-display { font-family: 'Monaco', 'Courier New', monospace; letter-spacing: 0.1em; font-weight: 900; }
        input[type="number"], textarea, input[type="text"] { font-size: 16px !important; }
        
        /* Fullscreen styles */
        body.fullscreen-mode {
            position: fixed;
            width: 100vw;
            height: 100dvh;
            top: 0;
            left: 0;
            z-index: 10000;
        }
        
        body.fullscreen-mode #setup-section, 
        body.fullscreen-mode #setup-section-interval,
        body.fullscreen-mode .tab-navigation,
        body.fullscreen-mode .control-buttons { 
            display: none !important; 
        }
        
        body.fullscreen-mode .timer-container { 
            width: 100vw;
            height: 100dvh;
            position: fixed;
            top: 0;
            left: 0;
            border-radius: 0;
            border: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #030712 0%, #0f0f1e 100%);
        }
        
        body.fullscreen-mode .timer-display { 
            font-size: clamp(60px, 45vw, 50vh) !important;
            line-height: 1;
            color: #10b981;
            text-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
        }
        
        body.fullscreen-mode .phase-display {
            font-size: clamp(30px, 12vw, 15vh) !important;
            line-height: 1.3;
            font-weight: 900;
            color: #f3f4f6;
            margin-top: 1rem;
            text-align: center;
            max-width: 90%;
            word-wrap: break-word;
            word-break: break-word;
        }
        
        body.fullscreen-mode .round-display {
            font-size: clamp(14px, 2.5vw, 3vh) !important;
            margin-top: 1rem;
            color: #9ca3af;
        }
        
        body.fullscreen-mode .exit-fullscreen-btn { 
            display: block !important; 
        }
        
        /* Vertical orientation (portrait) */
        @media (orientation: portrait) {
            body.fullscreen-mode .timer-container {
                padding: 2rem 1rem;
            }
            
            body.fullscreen-mode .timer-display {
                font-size: clamp(50px, 40vw, 45vh) !important;
                margin-bottom: 1rem;
            }
            
            body.fullscreen-mode .phase-display {
                font-size: clamp(24px, 10vw, 12vh) !important;
                margin: 1rem 0;
            }
        }
        
        /* Horizontal orientation (landscape) */
        @media (orientation: landscape) {
            body.fullscreen-mode .timer-container {
                padding: 1rem 2rem;
                flex-direction: row;
                gap: 2rem;
            }
            
            body.fullscreen-mode .timer-display {
                font-size: clamp(50px, 35vw, 40vh) !important;
            }
            
            body.fullscreen-mode .phase-display {
                font-size: clamp(20px, 8vw, 10vh) !important;
                margin: 0;
                flex: 1;
            }
            
            body.fullscreen-mode .round-display {
                position: absolute;
                bottom: 2rem;
                right: 2rem;
            }
        }
        
        /* iPad and larger screens */
        @media (min-width: 768px) {
            body.fullscreen-mode .timer-display {
                font-size: clamp(60px, 35vw, 50vh) !important;
            }
            
            body.fullscreen-mode .phase-display {
                font-size: clamp(28px, 10vw, 14vh) !important;
            }
        }
        
        .exit-fullscreen-btn { 
            display: none; 
            position: fixed; 
            top: 20px; 
            right: 20px; 
            z-index: 10001; 
            background: rgba(255,255,255,0.1); 
            padding: 8px 16px; 
            border-radius: 8px; 
            font-weight: bold;
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body class="bg-gray-950 text-white font-sans flex flex-col h-screen overflow-hidden">

    <!-- Tab Navigation -->
    <div class="tab-navigation flex gap-2 p-3 bg-gray-900 border-b border-gray-800 shrink-0">
        <button onclick="switchTab('training')" class="tab-btn flex-1 py-2 px-3 rounded-lg font-bold text-sm transition active:scale-95 bg-red-600 hover:bg-red-500" data-tab="training">
            ⏳ Training Timer
        </button>
        <button onclick="switchTab('interval')" class="tab-btn flex-1 py-2 px-3 rounded-lg font-bold text-sm transition active:scale-95 bg-gray-700 hover:bg-gray-600" data-tab="interval">
            🔄 Interval Training
        </button>
    </div>

    <!-- Training Timer Tab -->
    <div id="training" class="tab-content active flex-col flex-grow p-4 overflow-y-auto">
        <div class="flex flex-col gap-4 flex-grow">
            <!-- Input Section -->
            <div id="setup-section" class="bg-gray-900 p-4 rounded-xl border border-gray-800 max-h-[35vh] overflow-y-auto">
                <h3 class="text-lg font-black mb-3 text-red-400">Training Timer Setup</h3>
                <div class="grid grid-cols-3 gap-3 mb-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-1">Minutes</label>
                        <input type="number" id="training-minutes" value="5" min="0" max="59" class="w-full bg-gray-950 border border-gray-700 rounded-lg p-2 text-center font-bold text-white focus:outline-none focus:border-red-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-1">Seconds</label>
                        <input type="number" id="training-seconds" value="0" min="0" max="59" class="w-full bg-gray-950 border border-gray-700 rounded-lg p-2 text-center font-bold text-white focus:outline-none focus:border-red-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-1">Rounds</label>
                        <input type="number" id="training-rounds" value="1" min="1" max="100" class="w-full bg-gray-950 border border-gray-700 rounded-lg p-2 text-center font-bold text-white focus:outline-none focus:border-red-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-1">Training Details</label>
                    <textarea id="training-details" placeholder="e.g., Sprint intervals..." class="w-full bg-gray-950 border border-gray-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-red-500 h-20 resize-none"></textarea>
                </div>
            </div>

            <!-- Timer Display -->
            <div class="timer-container bg-gradient-to-br from-gray-900 to-gray-950 p-6 rounded-xl border border-gray-800 flex-grow flex flex-col items-center justify-center relative">
                <button onclick="exitFullscreen()" class="exit-fullscreen-btn">✕ Exit</button>
                <div class="text-center w-full">
                    <div class="timer-display countdown-display text-red-400 mb-4" id="training-display">05:00</div>
                    <div id="training-details-display" class="text-sm text-gray-300 italic mt-2 phase-display"></div>
                    <div class="text-lg font-bold text-gray-300 mb-2 round-display">
                        Round: <span id="training-round-display" class="text-red-400">1</span>/<span id="training-total-rounds">1</span>
                    </div>
                </div>
            </div>

            <!-- Control Buttons -->
            <div class="control-buttons grid grid-cols-3 gap-3">
                <button onclick="startTraining()" class="py-3 px-4 bg-red-600 hover:bg-red-500 active:bg-red-700 text-white font-black rounded-lg transition active:scale-95">
                    ▶️ Start
                </button>
                <button onclick="pauseTraining()" class="py-3 px-4 bg-yellow-600 hover:bg-yellow-500 active:bg-yellow-700 text-white font-black rounded-lg transition active:scale-95">
                    ⏸️ Pause
                </button>
                <button onclick="resetTraining()" class="py-3 px-4 bg-gray-700 hover:bg-gray-600 active:bg-gray-800 text-white font-black rounded-lg transition active:scale-95">
                    🔄 Reset
                </button>
            </div>
        </div>
    </div>

    <!-- Interval Training Tab -->
    <div id="interval" class="tab-content flex-col flex-grow p-4 overflow-y-auto">
        <div class="flex flex-col gap-4 flex-grow">
            <!-- Input Section -->
            <div id="setup-section-interval" class="bg-gray-900 p-4 rounded-xl border border-gray-800 max-h-[40vh] overflow-y-auto">
                <h3 class="text-lg font-black mb-3 text-emerald-400">Interval Training Setup</h3>
                <div class="grid grid-cols-3 gap-3 mb-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-1">Work Time (sec)</label>
                        <input type="number" id="interval-work-time" value="30" min="1" max="600" class="w-full bg-gray-950 border border-gray-700 rounded-lg p-2 text-center font-bold text-white focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-1">Recovery Time (sec)</label>
                        <input type="number" id="interval-recovery-time" value="30" min="1" max="600" class="w-full bg-gray-950 border border-gray-700 rounded-lg p-2 text-center font-bold text-white focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-1">Rounds</label>
                        <input type="number" id="interval-rounds" value="5" min="1" max="100" class="w-full bg-gray-950 border border-gray-700 rounded-lg p-2 text-center font-bold text-white focus:outline-none focus:border-emerald-500">
                    </div>
                </div>
                
                <div class="mb-3">
                    <label class="block text-xs font-bold text-gray-400 mb-1">Work Phrase</label>
                    <textarea id="interval-work-details" placeholder="e.g., High intensity sprint..." class="w-full bg-gray-950 border border-gray-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-emerald-500 h-16 resize-none"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-1">Recovery Phrase</label>
                    <textarea id="interval-recovery-details" placeholder="e.g., Easy pace, catch breath..." class="w-full bg-gray-950 border border-gray-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-emerald-500 h-16 resize-none"></textarea>
                </div>
            </div>

            <!-- Timer Display -->
            <div class="timer-container bg-gradient-to-br from-gray-900 to-gray-950 p-6 rounded-xl border border-gray-800 flex-grow flex flex-col items-center justify-center relative">
                <button onclick="exitFullscreen()" class="exit-fullscreen-btn">✕ Exit</button>
                <div class="timer-display countdown-display text-emerald-400" id="interval-display">00:30</div>
                <div id="interval-details-display" class="phase-display text-emerald-200"></div>
                <div class="text-lg font-bold text-gray-300 round-display">
                    Round: <span id="interval-round-display" class="text-emerald-400">1</span>/<span id="interval-total-rounds">5</span>
                </div>
            </div>

            <!-- Control Buttons -->
            <div class="control-buttons grid grid-cols-3 gap-3">
                <button onclick="startInterval()" class="py-3 px-4 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-black rounded-lg transition active:scale-95">
                    ▶️ Start
                </button>
                <button onclick="pauseInterval()" class="py-3 px-4 bg-yellow-600 hover:bg-yellow-500 active:bg-yellow-700 text-white font-black rounded-lg transition active:scale-95">
                    ⏸️ Pause
                </button>
                <button onclick="resetInterval()" class="py-3 px-4 bg-gray-700 hover:bg-gray-600 active:bg-gray-800 text-white font-black rounded-lg transition active:scale-95">
                    🔄 Reset
                </button>
            </div>
        </div>
    </div>

    <script>
        // ===== AUDIO CONTEXT HELPER (from timer.html) =====
        function getAudioCtx() {
            if (!window.sharedAudioCtx) {
                window.sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (window.sharedAudioCtx.state === 'suspended') {
                window.sharedAudioCtx.resume();
            }
            return window.sharedAudioCtx;
        }

        // ===== SOUND FUNCTION (Exact copy from timer.html) =====
        function playTrackBeep(isFinal) {
            try {
                const audioCtx = getAudioCtx();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                oscillator.type = 'square';
                oscillator.frequency.setValueAtTime(isFinal ? 990 : 490, audioCtx.currentTime + 0.05);
                
                gainNode.gain.setValueAtTime(0, audioCtx.currentTime + 0.05);
                gainNode.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.06);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime + (isFinal ? 0.8 : 0.4) - 0.01);
                gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + (isFinal ? 0.8 : 0.4));
                
                oscillator.start(audioCtx.currentTime + 0.05);
                oscillator.stop(audioCtx.currentTime + (isFinal ? 0.8 : 0.4));
                
                oscillator.onended = () => {
                    oscillator.disconnect();
                    gainNode.disconnect();
                };
            } catch (e) {
                console.error(e);
            }
        }

        // ===== FULLSCREEN HELPERS =====
        function enterFullscreen() {
            document.body.classList.add('fullscreen-mode');
        }

        function exitFullscreen() {
            document.body.classList.remove('fullscreen-mode');
        }

        // ===== TRAINING TIMER =====
        let trainingInterval = null;
        let trainingRunning = false;
        let trainingRemaining = 0;
        let trainingCurrentRound = 1;
        let trainingTotalRounds = 1;
        let trainingCountdownPhase = false;
        let trainingCountdownValue = 5;

        function startTraining() {
            if (trainingRunning) return;
            
            if (trainingRemaining === 0) {
                const mins = parseInt(document.getElementById('training-minutes').value) || 0;
                const secs = parseInt(document.getElementById('training-seconds').value) || 0;
                trainingRemaining = mins * 60 + secs;
                trainingTotalRounds = parseInt(document.getElementById('training-rounds').value) || 1;
                trainingCurrentRound = 1;
                trainingCountdownPhase = true;
                trainingCountdownValue = 5;
                enterFullscreen();
            }
            
            trainingRunning = true;
            trainingInterval = setInterval(() => {
                if (trainingCountdownPhase) {
                    if (trainingCountdownValue > 0) {
                        playTrackBeep(false);
                        document.getElementById('training-display').textContent = trainingCountdownValue;
                        trainingCountdownValue--;
                    } else {
                        playTrackBeep(true);
                        trainingCountdownPhase = false;
                        trainingCountdownValue = -1;
                        updateTrainingDisplay();
                    }
                } else {
                    trainingRemaining--;
                    updateTrainingDisplay();
                    
                    if (trainingRemaining === 20 || trainingRemaining === 10) {
                        playTrackBeep(false);
                    }
                    
                    if (trainingRemaining === 0) {
                        playTrackBeep(true);
                        if (trainingCurrentRound < trainingTotalRounds) {
                            trainingCurrentRound++;
                            trainingCountdownPhase = true;
                            trainingCountdownValue = 5;
                        } else {
                            clearInterval(trainingInterval);
                            trainingRunning = false;
                            exitFullscreen();
                        }
                    }
                }
            }, 1000);
        }

        function pauseTraining() {
            trainingRunning = false;
            clearInterval(trainingInterval);
        }

        function resetTraining() {
            trainingRunning = false;
            clearInterval(trainingInterval);
            trainingRemaining = 0;
            trainingCurrentRound = 1;
            trainingCountdownPhase = false;
            trainingCountdownValue = 5;
            updateTrainingDisplay();
            exitFullscreen();
        }

        function updateTrainingDisplay() {
            if (trainingCountdownPhase && trainingCountdownValue > 0) {
                document.getElementById('training-display').textContent = trainingCountdownValue;
            } else if (trainingCountdownValue === 0) {
                document.getElementById('training-display').textContent = 'GO!';
            } else {
                const mins = Math.floor(trainingRemaining / 60);
                const secs = trainingRemaining % 60;
                document.getElementById('training-display').textContent = 
                    `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            }
            
            document.getElementById('training-round-display').textContent = trainingCurrentRound;
            document.getElementById('training-total-rounds').textContent = trainingTotalRounds;
            document.getElementById('training-details-display').textContent = document.getElementById('training-details').value;
        }

        // ===== INTERVAL TRAINING =====
        let intervalTimer = null;
        let intervalRunning = false;
        let intervalRemaining = 0;
        let intervalCurrentRound = 1;
        let intervalTotalRounds = 1;
        let intervalIsWorkPhase = true;
        let intervalWorkTime = 30;
        let intervalRecoveryTime = 30;
        let intervalStartCountdown = 5;
        let intervalInStartPhase = false;

        function startInterval() {
            if (intervalRunning) return;
            
            if (intervalRemaining === 0) {
                intervalWorkTime = parseInt(document.getElementById('interval-work-time').value) || 30;
                intervalRecoveryTime = parseInt(document.getElementById('interval-recovery-time').value) || 30;
                intervalTotalRounds = parseInt(document.getElementById('interval-rounds').value) || 1;
                intervalCurrentRound = 1;
                intervalIsWorkPhase = true;
                intervalRemaining = intervalWorkTime;
                intervalStartCountdown = 5;
                intervalInStartPhase = true;
                enterFullscreen();
            }
            
            intervalRunning = true;
            intervalTimer = setInterval(() => {
                if (intervalInStartPhase) {
                    if (intervalStartCountdown > 0) {
                        playTrackBeep(false);
                        document.getElementById('interval-display').textContent = intervalStartCountdown;
                        intervalStartCountdown--;
                    } else {
                        playTrackBeep(true);
                        intervalInStartPhase = false;
                        updateIntervalDisplay();
                    }
                } else {
                    intervalRemaining--;
                    updateIntervalDisplay();
                    
                    // Sound reminders for last 5 seconds of recovery
                    if (!intervalIsWorkPhase && intervalRemaining <= 5 && intervalRemaining > 0) {
                        playTrackBeep(false);
                    }
                    
                    if (intervalRemaining === 0) {
                        playTrackBeep(true);
                        if (intervalIsWorkPhase) {
                            intervalIsWorkPhase = false;
                            intervalRemaining = intervalRecoveryTime;
                        } else {
                            if (intervalCurrentRound < intervalTotalRounds) {
                                intervalCurrentRound++;
                                intervalIsWorkPhase = true;
                                intervalRemaining = intervalWorkTime;
                            } else {
                                clearInterval(intervalTimer);
                                intervalRunning = false;
                                exitFullscreen();
                            }
                        }
                    }
                }
            }, 1000);
        }

        function pauseInterval() {
            intervalRunning = false;
            clearInterval(intervalTimer);
        }

        function resetInterval() {
            intervalRunning = false;
            clearInterval(intervalTimer);
            intervalRemaining = 0;
            intervalCurrentRound = 1;
            intervalIsWorkPhase = true;
            intervalInStartPhase = false;
            updateIntervalDisplay();
            exitFullscreen();
        }

        function updateIntervalDisplay() {
            const mins = Math.floor(intervalRemaining / 60);
            const secs = intervalRemaining % 60;
            document.getElementById('interval-display').textContent = 
                `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            
            const details = intervalIsWorkPhase ? 
                document.getElementById('interval-work-details').value : 
                document.getElementById('interval-recovery-details').value;
            document.getElementById('interval-details-display').textContent = details;
            
            document.getElementById('interval-round-display').textContent = intervalCurrentRound;
            document.getElementById('interval-total-rounds').textContent = intervalTotalRounds;
        }

        // ===== TAB SWITCHING =====
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-red-600', 'hover:bg-red-500', 'bg-emerald-600', 'hover:bg-emerald-500');
                btn.classList.add('bg-gray-700', 'hover:bg-gray-600');
            });
            
            document.getElementById(tabName).classList.add('active');
            const activeBtn = document.querySelector(`[data-tab="${tabName}"]`);
            activeBtn.classList.remove('bg-gray-700', 'hover:bg-gray-600');
            if (tabName === 'training') {
                activeBtn.classList.add('bg-red-600', 'hover:bg-red-500');
            } else {
                activeBtn.classList.add('bg-emerald-600', 'hover:bg-emerald-500');
            }
        }

        // Initialize displays
        updateTrainingDisplay();
        updateIntervalDisplay();
    </script>
</body>
</html>
